<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 240 56" width="240" height="56" fill="none">
  <defs>
    <linearGradient id="logoGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#00f2fe" />
      <stop offset="50%" stop-color="#4facfe" />
      <stop offset="100%" stop-color="#8b5cf6" />
    </linearGradient>
    <linearGradient id="textGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#00d2fe" />
      <stop offset="100%" stop-color="#a78bfa" />
    </linearGradient>
    <filter id="logoGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#6366f1" flood-opacity="0.3" />
    </filter>
  </defs>

  <!-- Logo Mark (Left) -->
  <g transform="translate(4, 4)">
    <!-- Badge Background -->
    <rect x="0" y="0" width="48" height="48" rx="13" fill="#0f172a" stroke="url(#logoGrad)" stroke-width="1.5" filter="url(#logoGlow)" />
    
    <!-- Isometric Pixel Cubes -->
    <polygon points="16,10 22,7 28,10 22,13" fill="#38bdf8" />
    <polygon points="16,10 22,13 22,20 16,17" fill="#0284c7" />
    <polygon points="22,13 28,10 28,17 22,20" fill="#0369a1" />
    <polygon points="11,18 16,15 16,23 11,26" fill="#818cf8" />
    <polygon points="11,27 16,24 16,32 11,35" fill="#6366f1" />

    <!-- Shutter / Aperture Arc -->
    <path d="M26 11 C34 11 39 16 39 24 C39 32 34 38 26 38" stroke="url(#logoGrad)" stroke-width="2.5" stroke-linecap="round" fill="none" />
    
    <!-- Anvil & Spark -->
    <path d="M19 29 H31 C32 29 32.5 30 31.8 30.8 L29.5 32.5 C28.5 33.5 28.5 35 29.5 36 H20.5 C21.5 35 21.5 33.5 20.5 32.5 L18.2 30.8 C17.5 30 18 29 19 29 Z" fill="#1e293b" stroke="url(#logoGrad)" stroke-width="1.2" />
    <polygon points="25,20 26.5,24 30.5,25 27,27 28.5,31 25,28 21.5,31 23,27 19.5,25 23.5,24" fill="#00f2fe" />
    <circle cx="25" cy="25.5" r="1.8" fill="#ffffff" />
  </g>

  <!-- Typography -->
  <!-- "Pixel" in Crisp White / Theme-adapted Fill -->
  <text x="64" y="32" font-family="'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="22" font-weight="800" fill="currentColor" letter-spacing="-0.5">Pixel</text>
  <!-- "Forge" in Gradient Accent -->
  <text x="119" y="32" font-family="'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="22" font-weight="800" fill="url(#textGrad)" letter-spacing="-0.5">Forge</text>
  <!-- Subtitle / Tagline -->
  <text x="65" y="44" font-family="'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="9.5" font-weight="600" fill="#64748b" letter-spacing="1.2">IMAGE RESIZER &amp; COMPRESSOR</text>
</svg>

